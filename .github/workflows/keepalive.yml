# Keeps the Render free-tier backend and Neon database from sleeping.
# Render spins down after 15 minutes of inactivity; this runs every 10 minutes.
# Neon suspends compute after 5 minutes; ?db=1 triggers SELECT 1 to keep Neon warm.
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend and Neon Database
        run: |
          BACKEND="${{ vars.BACKEND_URL }}"
          if [ -z "$BACKEND" ]; then
            BACKEND="https://epitopx-backend.onrender.com"
          fi
          echo "Pinging backend at: $BACKEND/api/health/?db=1"
          curl -sS -i --max-time 120 --retry 3 --retry-delay 5 "$BACKEND/api/health/?db=1"

      - name: Ping Frontend
        run: |
          FRONTEND="${{ vars.SITE_URL }}"
          if [ -z "$FRONTEND" ]; then
            FRONTEND="https://epitopx-frontend.onrender.com"
          fi
          echo "Pinging frontend at: $FRONTEND"
          curl -sS -o /dev/null -w "Frontend HTTP %{http_code} in %{time_total}s\n" \
            --max-time 60 --retry 2 "$FRONTEND" || true
