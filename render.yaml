# render.yaml — EpitopX AI deployment configuration
# Deploy on https://render.com by connecting your Git repository.
#
# Services:
#   1. epitopx-backend  — Django REST API  (Python)
#   2. epitopx-frontend — Node.js frontend (Node)
#   3. epitopx-db       — PostgreSQL database (managed by Render)
#
# After first deploy:
#   • Copy the epitopx-backend URL (e.g. https://epitopx-backend.onrender.com)
#     and set it as REMOTE_API / EPITOPE_API / ALIGNMENT_API on epitopx-frontend.
#   • Copy the epitopx-frontend URL and set it as FRONTEND_URL on epitopx-backend.

databases:
  - name: epitopx-db
    databaseName: backend_db
    user: epitopx
    plan: free

services:

  # ── Django backend ───────────────────────────────────────────────────
  - type: web
    name: epitopx-backend
    runtime: python
    rootDir: backend
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py seed_demo_users
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: epitopx-db
          property: connectionString
      # ⚠️  After the frontend is deployed, set this to your frontend URL:
      - key: FRONTEND_URL
        value: https://epitopx-frontend.onrender.com
      - key: PYTHON_VERSION
        value: "3.12.0"

  # ── Node.js frontend ─────────────────────────────────────────────────
  - type: web
    name: epitopx-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # ⚠️  After the backend is deployed, set these to your backend URL:
      - key: REMOTE_API
        value: https://epitopx-backend.onrender.com
      - key: EPITOPE_API
        value: https://epitopx-backend.onrender.com
      - key: ALIGNMENT_API
        value: https://epitopx-backend.onrender.com
      # Optional — LLM integration:
      # - key: LLM_PROVIDER
      #   value: groq
      # - key: LLM_API_KEY
      #   value: your_groq_api_key_here
